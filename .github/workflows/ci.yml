name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Dart deps
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check
        run: pnpm format:check && pnpm --filter mobile format:check

      - name: Lint, typecheck, test
        run: pnpm turbo run lint typecheck test

  backend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: nihongo
          POSTGRES_DB: nihongo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://nihongo:nihongo@localhost:5432/nihongo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:e2e --filter=backend

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
